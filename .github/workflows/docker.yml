name: Docker

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Construire les images de production
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./BackendApte/backendapte
          - name: frontend
            context: ./FrontendApte/aptefrontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire ${{ matrix.name }} (cible prod)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: prod
          push: false
          load: true
          tags: apte-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  smoke:
    name: Démarrage de la pile (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valider le fichier compose
        run: docker compose config --quiet

      - name: Démarrer la base et le backend
        run: docker compose up --build --detach db backend

      - name: Attendre que le backend réponde
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health/ >/dev/null 2>&1; then
              echo "Backend prêt après ${attempt}s."
              exit 0
            fi
            sleep 1
          done
          echo "Le backend n'a pas répondu dans le délai imparti." >&2
          docker compose logs --no-color backend db
          exit 1

      - name: Vérifier que l'API répond
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/health/ | grep -q '"status": "ok"'
          # Le catalogue est public : il doit répondre sans authentification.
          curl -fsS http://localhost:8000/api/products/ >/dev/null
          # Les commandes exigent une authentification.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/orders/)
          test "$code" = "401" || { echo "Attendu 401 sur /api/orders/, reçu $code" >&2; exit 1; }
          # Un webhook de paiement non signé doit être refusé.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d '{"id":"faux","payment_status":"succeeded"}' \
            http://localhost:8000/api/orders/wave-callback/)
          test "$code" = "403" || { echo "Attendu 403 sur le webhook non signé, reçu $code" >&2; exit 1; }
          echo "Contrôles de fumée réussis."

      - name: Exécuter la suite de tests dans le conteneur
        run: docker compose run --rm tests

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color

      - name: Arrêter la pile
        if: always()
        run: docker compose down --volumes --remove-orphans
