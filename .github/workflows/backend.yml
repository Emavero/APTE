name: Backend

on:
  push:
    branches: [master, main]
    paths:
      - "BackendApte/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "BackendApte/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: BackendApte/backendapte

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Qualité du code (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: BackendApte/backendapte/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .

  tests:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apte_ci
          POSTGRES_USER: apte
          POSTGRES_PASSWORD: apte
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apte"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: backendapte.settings.test
      DJANGO_SECRET_KEY: cle-de-ci
      POSTGRES_DB: apte_ci
      POSTGRES_USER: apte
      POSTGRES_PASSWORD: apte
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: BackendApte/backendapte/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Vérifier qu'aucune migration n'est manquante
        env:
          DJANGO_SETTINGS_MODULE: backendapte.settings.dev
        run: python manage.py makemigrations --check --dry-run

      - name: Vérifier que les migrations s'appliquent sur PostgreSQL
        env:
          DJANGO_SETTINGS_MODULE: backendapte.settings.dev
          DJANGO_SECRET_KEY: cle-de-ci
        run: python manage.py migrate --noinput

      - name: Suite de tests
        run: pytest --cov=apps --cov-report=term-missing --cov-report=xml

      - name: Publier le rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: BackendApte/backendapte/coverage.xml
          if-no-files-found: ignore

  checks:
    name: Contrôles de déploiement Django
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: BackendApte/backendapte/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: backendapte.settings.prod
          DJANGO_ALLOWED_HOSTS: apte.example.com
        run: |
          # Clé aléatoire : une clé courte déclencherait security.W009 et ferait
          # échouer le contrôle pour une mauvaise raison.
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" \
            python manage.py check --deploy --fail-level WARNING

      - name: Générer le schéma OpenAPI
        env:
          DJANGO_SETTINGS_MODULE: backendapte.settings.dev
          DJANGO_SECRET_KEY: cle-de-ci
        run: python manage.py spectacular --fail-on-warn --file openapi.yaml

      - name: Publier le schéma
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: BackendApte/backendapte/openapi.yaml
