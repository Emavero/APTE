version: '3.8'

services:
  backend:
    build:
      context: ./BackendApte/backendapte
      dockerfile: Dockerfile
    
    ports:
      - "8000:8000"
    volumes:
      - ./BackendApte/backendapte:/app
    env_file:
      - ./BackendApte/backendapte/.env
    depends_on:
      - db
    environment:
      - DEBUG=True

  frontend:
    build:
      context: ./FrontendApte/aptefrontend
      dockerfile: Dockerfile
   
    ports:
      - "5173:5173"
    volumes:
      - ./FrontendApte/aptefrontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    stdin_open: true
    tty: true

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: